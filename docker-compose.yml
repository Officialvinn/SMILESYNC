# Local demo stack: PostgreSQL, the API and Caddy (TLS 1.3).
#   cp .env.example .env    # then fill in the secrets
#   docker compose up -d --build
# The API is only reachable through Caddy at https://localhost/api/...

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smilesync}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # Bound to this machine only, so tests and Prisma Studio can reach it.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    environment:
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smilesync}
      PATIENT_DATA_KEY: ${PATIENT_DATA_KEY:?set in .env}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SEED_CHW_PIN: ${SEED_CHW_PIN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://smilesync_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-smilesync}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      PATIENT_DATA_KEY: ${PATIENT_DATA_KEY:?set in .env}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      TRUST_PROXY_HOPS: 1
      IMAGE_STORAGE_DIR: /app/apps/api/storage
    volumes:
      # Encrypted oral images (NFR 1). Back up together with pgdata.
      - images:/app/apps/api/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  images:
  caddy_data:
  caddy_config:
